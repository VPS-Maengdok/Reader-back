# Fixed project name: without it Compose uses the folder name, and ~/portfolio/back
# and ~/reader/back would both be project "back" (orphan warnings, and
# --remove-orphans would delete the other stack's container).
name: reader-back

services:
  reader-back:
    # Built and pushed by the release workflow, never built on the server.
    # IMAGE_TAG is the sha-<commit> tag being deployed; "latest" is never deployed.
    image: ghcr.io/vps-maengdok/reader-back:${IMAGE_TAG:?set IMAGE_TAG to the image tag to deploy}
    container_name: reader-back
    restart: unless-stopped
    # Runtime secrets (DATABASE_*, JWT_SECRET, ADMIN_*, ALLOW_ORIGINS) come from .env.
    # ADMIN_PASSWORD and JWT_SECRET must be at least 16 characters or the app refuses to start.
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3999
    # No published port: Traefik reaches the container on the proxy network.
    # postgresql: the app stores its data in the shared Postgres.
    networks:
      - proxy
      - postgresql
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.reader-back.rule=Host(`reader.back.maengdok.fr`)"
      - "traefik.http.routers.reader-back.entrypoints=websecure"
      - "traefik.http.services.reader-back.loadbalancer.server.port=3999"
    # TLS certificate and secure-headers come from the websecure entrypoint (P0.3)
    mem_limit: 512m
    pids_limit: 200
    user: node
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  proxy:
    name: proxy
    external: true
  postgresql:
    name: postgresql
    external: true
