name: release

# Builds the production image of every commit on main and pushes it to GHCR.
# Tags: sha-<7 chars> (the one deployed) and latest (moving pointer, never deployed).
# Deploying is a separate, manual and approved step: see deploy.yml.
on:
  push:
    branches:
      - main

permissions: {}

env:
  IMAGE: ghcr.io/vps-maengdok/reader-back

jobs:
  image:
    name: build and push the production image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/prod.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=reader-back
          cache-from: type=gha,scope=prod-image
          cache-to: type=gha,mode=max,scope=prod-image

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "Image pushed: \`$IMAGE:$TAG\`"
            echo
            echo "To deploy it, run the **deploy** workflow with tag \`$TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Keeps the package small: see .github/scripts/ghcr-cleanup.sh for the rules.
  # Deleting versions with GITHUB_TOKEN works because the repository that
  # published the package has admin access to it.
  cleanup:
    name: clean up old image versions
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    # Never two cleanups at once; a running one is never cancelled.
    concurrency:
      group: ghcr-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: reader-back
          KEEP: '3'
          KEEP_DEPLOYS: '2'
        run: ./.github/scripts/ghcr-cleanup.sh
